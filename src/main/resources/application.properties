# ═══════════════════════════════════════════════════════
#  FleetFlow - Application Configuration
#  File location: src/main/resources/application.properties
# ═══════════════════════════════════════════════════════

# ── SERVER ──────────────────────────────────────────────
# The port the app runs on.
# After starting, open: http://localhost:8080
server.port=8080

# ── DATABASE CONNECTION ──────────────────────────────────
# This connects to the PostgreSQL database started by docker-compose.
# Format: jdbc:postgresql://HOST:PORT/DATABASE_NAME
#
# Environment variables override these defaults in production/Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetflow_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fleetflow_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fleetflow_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / HIBERNATE ──────────────────────────────────────
# validate = Hibernate checks that your entity classes
# match the database tables. It does NOT create or change tables.
# Flyway handles all table creation (V1__init.sql etc.)
spring.jpa.hibernate.ddl-auto=validate

# Show SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate we are using PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── FLYWAY ───────────────────────────────────────────────
# Flyway automatically runs SQL files in db/migration/ folder.
# It looks for files named: V1__something.sql, V2__something.sql etc.
# It runs them IN ORDER and ONLY ONCE. Never runs the same file twice.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT (JSON Web Token) ──────────────────────────────────
# Secret key used to sign and verify JWT tokens.
# In production this MUST be set as an environment variable.
# For local development the fallback default is used.
#
# The app reads this with: @Value("${jwt.secret}")
jwt.secret=${JWT_SECRET:fleetflow-dev-secret-key-change-this-in-production-must-be-long}
jwt.expiration=86400000
# 86400000 milliseconds = 24 hours
# After 24 hours the token expires and the user must login again.

# ── SWAGGER UI ────────────────────────────────────────────
# The interactive API documentation page.
# After starting the app, open: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
# Allow Swagger to work even with security enabled
springdoc.swagger-ui.operationsSorter=method

# ── LOGGING ──────────────────────────────────────────────
# Controls what gets printed in the console.
# INFO = normal messages, ERROR = only errors, DEBUG = everything
logging.level.com.fleetflow=DEBUG
logging.level.org.springframework.security=INFO
